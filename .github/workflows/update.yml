name: Update text data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5  # Обновлено с v4 на v5

      - name: Setup Python
        uses: actions/setup-python@v6  # Обновлено с v5 на v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot
        run: |
          python bot.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add result.txt

          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Automatic update"
            git push
          fi
